name: Temporary PHP lint

on:
  push:
    branches:
      - fix/confirmed-audit-bugs
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint changed PHP files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          files=$(git diff --name-only origin/main...HEAD | grep -E '\.php$' || true)
          if [ -z "$files" ]; then
            echo "No changed PHP files"
            exit 0
          fi
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            php -l "$file"
          done <<< "$files"
