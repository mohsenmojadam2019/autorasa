name: Temporary PHP lint

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/workflows/temporary-php-lint.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint changed PHP files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
            | grep -E '\.php$' \
            | while IFS= read -r file; do
                [ -f "$file" ] || continue
                php -l "$file"
              done
