name: Temporary merged lock generation

on:
  push:
    branches:
      - chore/sync-composer-lock
    paths:
      - .github/workflows/temporary-merged-lock-generation.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, gd, json, pdo_mysql, zip, soap
          coverage: none
      - name: Use main identity for local path packages
        run: git branch -m main
      - name: Save original lock
        run: cp composer.lock /tmp/composer.lock.before
      - name: Apply merge-plugin lock resolution
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Assert only the expected nine package resolutions changed
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          before = json.loads(Path('/tmp/composer.lock.before').read_text())
          after = json.loads(Path('composer.lock').read_text())

          def package_map(lock):
              result = {}
              for section in ('packages', 'packages-dev'):
                  for pkg in lock.get(section, []):
                      result[pkg['name']] = {
                          'section': section,
                          'version': pkg.get('version'),
                          'source_reference': (pkg.get('source') or {}).get('reference'),
                          'dist_reference': (pkg.get('dist') or {}).get('reference'),
                      }
              return result

          expected = {
              'bacon/bacon-qr-code': ('v3.0.1', 'v3.1.1'),
              'khaled.alshamaa/ar-php': ('v6.3.0', 'v6.3.4'),
              'laravel/socialite': ('v5.18.0', 'v5.30.0'),
              'razorpay/razorpay': ('2.9.0', '2.9.3'),
              'spatie/simple-excel': ('3.7.2', '3.7.3'),
              'symfony/cache': ('v6.4.19', 'v6.4.44'),
              'symfony/var-exporter': ('v6.4.19', 'v6.4.44'),
              'twilio/sdk': ('8.3.15', '8.12.0'),
              'vonage/client': ('4.1.1', '4.3.0'),
          }

          b, a = package_map(before), package_map(after)
          if b.keys() != a.keys():
              print('Package set changed unexpectedly', file=sys.stderr)
              print('Added:', sorted(a.keys() - b.keys()), file=sys.stderr)
              print('Removed:', sorted(b.keys() - a.keys()), file=sys.stderr)
              sys.exit(1)

          changed = {name for name in b if b[name] != a[name]}
          if changed != set(expected):
              print('Unexpected changed package set', file=sys.stderr)
              print('Expected:', sorted(expected), file=sys.stderr)
              print('Actual:', sorted(changed), file=sys.stderr)
              sys.exit(1)

          for name, (old, new) in expected.items():
              actual_old = b[name]['version']
              actual_new = a[name]['version']
              if (actual_old, actual_new) != (old, new):
                  print(f'{name}: expected {old} -> {new}, got {actual_old} -> {actual_new}', file=sys.stderr)
                  sys.exit(1)

          if before.get('content-hash') != after.get('content-hash'):
              print('Root content-hash changed unexpectedly', file=sys.stderr)
              sys.exit(1)

          print('Expected merge-plugin lock resolution confirmed')
          for name in sorted(expected):
              print(f"{name}: {expected[name][0]} -> {expected[name][1]}")
          PY
      - name: Validate generated lock
        run: composer validate --no-check-publish --no-interaction
      - name: Commit generated lock
        shell: bash
        run: |
          test -n "$(git status --porcelain -- composer.lock)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore: resolve merged Composer dependencies in lock'
          git push origin HEAD:chore/sync-composer-lock
